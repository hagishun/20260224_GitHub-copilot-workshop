<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ポモドーロタイマー</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="card">
    <!-- ヘッダー -->
    <div class="card-header">
      <h1 class="card-title">ポモドーロタイマー</h1>
      <div class="window-controls">
        <span class="control">ー</span>
        <span class="control">□</span>
        <span class="control">×</span>
      </div>
    </div>

    <!-- 状態表示 -->
    <div class="status-label" id="status-label">作業中</div>

    <!-- 円形タイマー -->
    <div class="timer-circle">
      <svg width="220" height="220" viewBox="0 0 220 220">
        <defs>
          <linearGradient id="progress-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#a855f7" />
          </linearGradient>
        </defs>
        <!-- 背景の円 -->
        <circle
          cx="110" cy="110" r="95"
          fill="none"
          stroke="rgba(0, 0, 0, 0.06)"
          stroke-width="8"
        />
        <!-- プログレスの円 -->
        <circle
          id="progress-ring"
          cx="110" cy="110" r="95"
          fill="none"
          stroke="url(#progress-gradient)"
          stroke-width="8"
          stroke-linecap="round"
          stroke-dasharray="596.90"
          stroke-dashoffset="0"
          transform="rotate(-90 110 110)"
        />
      </svg>
      <div class="timer-display" id="timer-display">25:00</div>
    </div>

    <!-- 操作ボタン -->
    <div class="controls">
      <button class="btn btn-primary" id="start-btn">開始</button>
      <button class="btn btn-outline" id="reset-btn">リセット</button>
    </div>

    <!-- 今日の進捗 -->
    <div class="progress-section">
      <h2 class="progress-title">今日の進捗</h2>
      <div class="progress-stats">
        <div class="stat">
          <span class="stat-value" id="completed-count">0</span>
          <span class="stat-label">完了</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="total-focus-time">0分</span>
          <span class="stat-label">集中時間</span>
        </div>
      </div>
    </div>

    <!-- ゲーミフィケーション: レベル＆XP -->
    <div class="gamification-section">
      <h2 class="progress-title">レベル＆経験値</h2>
      <div class="level-display">
        <div class="level-info">
          <span class="level-label">Level</span>
          <span class="level-value" id="user-level">1</span>
        </div>
        <div class="xp-bar-container">
          <div class="xp-bar" id="xp-bar" style="width: 0%"></div>
          <span class="xp-text" id="xp-text">0 / 100 XP</span>
        </div>
      </div>
    </div>

    <!-- ゲーミフィケーション: ストリーク -->
    <div class="streak-section">
      <h2 class="progress-title">連続記録</h2>
      <div class="streak-display">
        <div class="streak-icon">🔥</div>
        <div class="streak-info">
          <div class="streak-current" id="streak-current">0日連続</div>
          <div class="streak-longest" id="streak-longest">最長: 0日</div>
        </div>
      </div>
    </div>

    <!-- ゲーミフィケーション: バッジ -->
    <div class="badges-section">
      <h2 class="progress-title">獲得バッジ</h2>
      <div class="badges-grid" id="badges-grid">
        <div class="badge-placeholder">まだバッジがありません</div>
      </div>
    </div>

    <!-- ゲーミフィケーション: 統計切り替えタブ -->
    <div class="stats-tabs">
      <button class="stats-tab active" data-tab="weekly">週間統計</button>
      <button class="stats-tab" data-tab="monthly">月間統計</button>
    </div>

    <!-- 週間統計 -->
    <div class="stats-panel active" id="weekly-stats">
      <div class="stats-summary">
        <div class="stat">
          <span class="stat-value" id="weekly-sessions">0</span>
          <span class="stat-label">完了</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="weekly-minutes">0分</span>
          <span class="stat-label">集中時間</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="weekly-avg">0.0分</span>
          <span class="stat-label">日平均</span>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="weekly-chart"></canvas>
      </div>
    </div>

    <!-- 月間統計 -->
    <div class="stats-panel" id="monthly-stats">
      <div class="stats-summary">
        <div class="stat">
          <span class="stat-value" id="monthly-sessions">0</span>
          <span class="stat-label">完了</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="monthly-minutes">0分</span>
          <span class="stat-label">集中時間</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="monthly-avg">0.0分</span>
          <span class="stat-label">日平均</span>
        </div>
      </div>
      <div class="chart-container">
        <canvas id="monthly-chart"></canvas>
      </div>
    </div>

    <!-- ポモドーロインジケーター -->
    <div class="pomodoro-indicators" id="pomodoro-indicators">
      <span class="indicator" data-index="0">○</span>
      <span class="indicator" data-index="1">○</span>
      <span class="indicator" data-index="2">○</span>
      <span class="indicator" data-index="3">○</span>
    </div>

    <!-- セッション履歴 -->
    <div class="history-section" id="history-section" style="display: none;">
      <h2 class="progress-title">セッション履歴</h2>
      <ul class="history-list" id="history-list"></ul>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="{{ url_for('static', filename='js/ui.js') }}"></script>
</body>
</html>
